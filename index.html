<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>崔之行 · The World I See</title>
  <meta name="description" content="瞳孔、月亮、陨石、太阳 —— 滚动进入我看见的世界。崔之行的博客。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%2304060C'/><circle cx='50' cy='50' r='34' fill='%237FB0E8'/><circle cx='50' cy='50' r='14' fill='%2304060C'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,500;1,600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    /* ---- theme tokens (unlayered: beats the engine's @layer sw) ---- */
    :root, .sw-root {
      --sw-bg: #04060C;                                   /* 深空 */
      --sw-ink: #EDEAE2;                                  /* 暖纸白 */
      --sw-ink-soft: #8E96A8;
      --sw-accent: #7FB0E8;
      --sw-font-display: "Playfair Display", "Noto Serif SC", serif;
      --sw-font-body: "Noto Serif SC", "Songti SC", "PingFang SC", serif;
    }
    body { margin: 0; background: #04060C; }
    #world { min-height: 100vh; }

    /* ---- editorial chrome over the engine ---- */
    .sw-brand__name { font-style: italic; letter-spacing: .02em; }
    .sw-nav { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.09); }
    .sw-nav__item { color: var(--sw-ink-soft); }
    .sw-nav__item:hover { color: var(--sw-ink); }
    .sw-topcta { background: var(--sw-ink); color: #0A0D14; font-family: var(--sw-font-display); font-style: italic; }

    .sw-copy__num { color: color-mix(in srgb, var(--sw-accent) 75%, var(--sw-ink-soft)); }
    .sw-copy__eyebrow { font-family: var(--sw-font-body); font-weight: 400; letter-spacing: .34em; }
    .sw-copy__title {
      font-style: italic; font-weight: 500;
      font-size: clamp(2.6rem, 5.6vw, 4.8rem);
      letter-spacing: -.015em; line-height: 1.02;
    }
    .sw-copy__body { font-weight: 400; }
    .sw-copy__tags li {
      color: color-mix(in srgb, var(--sw-accent) 85%, #fff);
      background: color-mix(in srgb, var(--sw-accent) 10%, transparent);
      border-color: color-mix(in srgb, var(--sw-accent) 32%, transparent);
    }
    .sw-btn--primary { background: var(--sw-accent); color: #0A0D14; font-family: var(--sw-font-display); font-style: italic; }
    .sw-btn--ghost { color: var(--sw-ink); border-color: rgba(255,255,255,.28); }
    .sw-route__label { background: rgba(10,13,20,.85); color: var(--sw-ink); border-color: rgba(255,255,255,.1); }
    .sw-hint { font-family: var(--sw-font-body); }
  </style>
</head>
<body>
  <div id="world"></div>

  <script src="/assets/world/scrub-engine.js"></script>
  <script>
    // 首段视频预加载: 打开页面就并行下载第一段过渡, 滚动到时秒出
    (function preloadFirst() {
      var v = document.createElement('video');
      v.muted = true; v.playsInline = true; v.preload = 'auto';
      v.src = '/assets/world/vid/conn0.mp4';
    })();

    mountScrollWorld(document.getElementById('world'), {
      brand: { name: '崔之行', href: '/' },
      cta: { label: '进入博客', href: '/archive' },
      hint: 'Scroll · 滚动，进入我看见的世界',
      diveScroll: 1.15,
      connScroll: 1.15,
      crossfade: 0.18,
      nav: true,
      atmosphere: true,
      sections: [
        {
          id: 'eye', label: '瞳孔',
          still: '/assets/world/eye.webp'),
          accent: '#7FB0E8',
          eyebrow: 'CHAPTER 01 · 瞳孔 THE EYE',
          title: 'The World I See',
          body: '一切始于一次凝视。瞳孔是光进入身体的地方，也是我记录世界的入口。',
          tags: ['凝视', '起点'],
        },
        {
          id: 'moon', label: '月亮',
          still: '/assets/world/moon.webp'),
          accent: '#C7CDD6',
          eyebrow: 'CHAPTER 02 · 月亮 THE MOON',
          title: 'Silent Gravity',
          body: '隔着三十八万公里，依然牵引潮汐。有些陪伴，从不喧哗。',
          tags: ['寂静', '引力'],
        },
        {
          id: 'meteor', label: '陨石',
          still: '/assets/world/meteor.webp'),
          accent: '#C9A46B',
          eyebrow: 'CHAPTER 03 · 陨石 THE METEOR',
          title: 'Drift & Burn',
          body: '在抵达之前，每一块石头都在黑暗里飞了很久。漂泊不是迷路，是在路上。',
          tags: ['漂泊', '燃烧'],
        },
        {
          id: 'sun', label: '太阳',
          still: '/assets/world/sun.webp'),
          accent: '#FF7A2F',
          eyebrow: 'CHAPTER 04 · 太阳 THE SUN',
          title: 'Become the Light',
          body: '靠近光，追随光，成为光。我把看见的世界写在这里——欢迎到来。',
          tags: [],
          cta: {
            primary: { label: '进入博客', href: '/archive' },
            secondary: { label: 'GitHub', href: 'https://github.com/changer-changer' },
          },
        },
      ],
      connectors: [
        '/assets/world/vid/conn0.mp4',   // 瞳孔 → 月亮
        '/assets/world/vid/conn1.mp4',   // 月亮 → 陨石
        '/assets/world/vid/conn2.mp4',   // 陨石 → 太阳
      ],
    });
  </script>
</body>
</html>
