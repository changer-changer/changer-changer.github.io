        - {slug: post-055, q: "演化认知：事件而不是事物"}
        - {slug: post-058, q: "认知能定性，不能生成行动"}
        - {slug: post-057, q: "成功来自工匠式技能，而不是全局认知"}
        - {slug: working-memory-is-the-bottleneck, q: "人的工作记忆太小了"}
        - {slug: effort-is-a-habit, q: "努力不是一种能力"}
        - {slug: intelligence-and-hardwork-are-leashes, q: "聪明和努力是拴狗链"}
        - {slug: world-model-operation-model, q: "理解对象是什么，和它在任务里能做什么"}
