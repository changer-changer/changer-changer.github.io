      q: 目标定了以后，判断和执行怎么分工？
      points:
        - "选的时候，先把事实、最好的结果、最坏的风险、代价想一遍。做的时候，执行和目标分开。"
        - "大部分时间不是在做决定，是习惯、身体和长期积累在自动运转。反馈从现实里拿，不从脑子里拿。"
      posts:
