        - {slug: post-044, q: "专注时大脑发生了什么"}
        - {slug: post-022, q: "大脑操作系统：五大核心系统"}
        - {slug: environment-over-willpower, q: "能持续的改变靠环境，不靠意志"}
        - {slug: retrain-your-own-model, q: "错误的反馈环境如何塑造人"}
