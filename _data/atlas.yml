    - id: want
      n: "04"
      short: 我要什么
      title: 我为什么要这样活
      q: 目的从哪里来，什么是好？
      points:
        - "目的是加上人的限制之后的趋向。对我来说只有一个方向：解决我自己的问题。"
        - "主体性是出发点。我只有一个身体，后果只有我担。别人的路只是约束条件。"
      posts:
