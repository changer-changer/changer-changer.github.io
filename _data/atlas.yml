    - id: intelligence
      n: "08"
      short: 智力与 AI
      title: 最上面一层：智力与 AI
      q: 当智力不再只来自人，以人为中转的体系会怎样？
      points:
        - "整个科学和生产的体系，一直把人的智力当作必经的中转站。这依赖三件事：智力只来自人、人接收信息的通道很窄、人的思考有固定的长处和短处。"
        - "现在三件事都被打破了。以人为中转的体系可能要重搭。我还没想清楚搭成什么样。"
