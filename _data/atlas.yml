# 全站文章地图：每一篇上站的文章归属且只归属一处。
#  - worldview：世界观，按依赖顺序分层
#  - research ：研究与 Research 思考
#  - notes    ：随笔，按写作形态分节
# 早期笔记是世界观的地基，照常上站；只有内容已被推翻、和现行说法矛盾的文章才不上站（放在 _shelf/）。
# 加一篇新文章：把它的 slug 写进下面任意一组的 posts 或 slugs 里。

worldview:
  start: [map-of-my-worldview, how-i-maintain-my-beliefs]
  rules:
    - t: "没有真理，只有概念事实"
      d: "被临时当作事实来用的假设。它有用，是因为能解释现象、指导行动，并且随时准备被更好的说法替换。"
    - t: "只有现实的反馈算数"
      d: "读完觉得“我懂了”，做事的结果一点没变，那不算。这是最容易骗自己的地方。"
    - t: "新的一句话不自动成为原则"
      d: "状态好坏时说的话不是一个水平。新的说法要先放回旧的说法里比一比。"
  layers:
    - id: start
      n: "01"
      short: 凭什么开始想
      title: 我凭什么开始想
      q: 在做任何判断之前，我已经接受了哪些前提？
      points:
        - "这是一个有运作体系的世界，我是一个人。一切经验都是“对世界的认识”叠上“人的特点”，再用语言说出来。"
        - "想法是假设搭起来的，严格说都是幻觉，区别只在于经不经得起现实。任何描述都只是描述，未知远远多于已知。"
      posts:
        - {slug: theory-grand-unified-survival-theory-manifesto, q: "为什么想把这些问题放在一起"}
        - {slug: theory-axiom-of-existence-rationality, q: "我们如何理解“存在”"}
        - {slug: theory-reality-as-latent-space, q: "不是事物拥有性质，是性质聚合成了事物"}
        - {slug: theory-cognition-is-abstraction, q: "描述只能被趋近，不能等于"}
        - {slug: theory-cognitive-viruses-language, q: "语言怎样反过来塑造判断"}
        - {slug: post-042, q: "趋向理论：性质是方向轴上的位置"}
        - {slug: post-010, q: "逻辑、信息与本体"}
        - {slug: post-072, q: "命题逻辑笔记"}
        - {slug: thoughts-are-beliefs, q: "一切想法都是信念"}
        - {slug: worldview-assembled-from-outside, q: "大部分人的世界观是拼接起来的"}
        - {slug: known-unknown, q: "为什么越努力越迷茫"}
        - {slug: know-what-you-dont-know, q: "知道自己不知道什么"}
        - {slug: post-071, q: "人类认知的根本局限：三个结构性盲区"}
        - {slug: when-two-truths-conflict, q: "两句都对的话打架时，先看它们在哪一层"}

    - id: world
      n: "02"
      short: 世界如何运作
      title: 世界如何运作
      q: 事物为什么会朝某些方向变化？
      points:
        - "我用一个词描述世界：趋向。性质可以无限细分，有层级，有方向。已经发生的事都按逻辑运行。"
        - "生命是能保住复杂性的一种结构。不是最强的活下来，是某些性质在那个环境里更容易延续。"
      posts:
        - {slug: theory-tendency-theory-core, q: "趋向性，我用来观察变化的一个概念"}
        - {slug: theory-tendency-properties-linearity, q: "线性、守恒与认知边界"}
        - {slug: trend-thinking, q: "比第一性原理更底层的一种观察方式"}
        - {slug: theory-negentropy-complexity-enrichment, q: "负熵与复杂性"}
        - {slug: theory-biology-theory-negative-entropy, q: "生命如何与环境交换秩序"}
        - {slug: theory-consciousness-as-universe-property, q: "主观体验从哪里来"}
        - {slug: post-069, q: "宇宙法则的方向与社会的方向如何拉扯"}
        - {slug: post-011, q: "社会运作、欲望经济学与终极杠杆"}

    - id: human
      n: "03"
      short: 人是什么
      title: 我是怎样一个东西
      q: 人的认知、能力和感受，各自能走多远？
      points:
        - "人的认知非常有限，只能压缩、只够建一个局部模型。知道不等于做得到，能力是练进身体里的。"
        - "人是被反馈训练出来的。理性只在计划时好用，真做事时是感受在主导。"
      posts:
        - {slug: theory-dual-brain-system, q: "自动反应和后天模型如何协作"}
        - {slug: theory-embodied-chunking, q: "知道与做到之间差了什么"}
