contact_note: "如果你的问题需要同时理解技术、用户和交付，我愿意从具体场景聊起。"
signals:
  - title: "系统视角"
    detail: "能从传感器、通信、数据、模型一直看到机器人执行，不把“跑通一段代码”误认为完成。"
  - title: "业务翻译"
    detail: "把终端客户的模糊反馈拆成场景、任务链、Demo 和可核算的价值。"
  - title: "边界意识"
    detail: "区分已证实、当前完成和待补强，结果不够硬时，先把证据补齐。"
  - title: "快速成形"
    detail: "在高压和不确定里先做出可观察的最小版本，再用反馈决定下一步。"
case_studies:
  - number: "01"
    category: "systems"
    category_label: "ROBOTICS / SYSTEM"
    period: "2025.11 — 2026.03"
    title: "把触觉信号送到 VR，也送进下一次实验"
    one_liner: "从 Tac3D 传感器到 ROS2，再到 Meta Quest 端的 3D 触觉可视化。"
    problem: "触觉数据停留在采集端时，研究者很难直观看到接触表面和触觉分布；团队需要一条可用于实验的实时数据链路。"
    contribution: "调研并集成 Tac3D SDK，开发 ROS2 节点和机器人端数据处理逻辑；统一数据格式，用 UDP 与 ROS2—VR 桥接，把触觉点云实时渲染到 Meta Quest 3S。"
    outcome: "完成“传感器采集 → 机器人处理 → VR 可视化”的端到端闭环，并作为基础设施支持后续触觉实验。相关发明专利申请已获受理。"
    evidence: "专利申请受理通知书已核实；项目完成度和历史性能指标来自项目记录，公开页不写未经日志证明的延迟数字。"
    status_class: "verified"
    status_label: "部分核实"
    tags: ["Tac3D", "ROS2", "Meta Quest 3S", "UDP", "3D point cloud"]
  - number: "02"
    category: "systems"
    category_label: "ROBOTICS / FULL LOOP"
    period: "2025.12 — 2026.03"
    title: "让 TRON2 具备一条可训练、可执行的动作链"
    one_liner: "从机器人适配和 VR 遥操作，到数据采集、Diffusion Policy 训练与真机执行。"
    problem: "研究模型要真正落到机器人上，中间隔着 SDK、数据格式、遥操作、训练、推理和实时控制；任何一段断开，模型就只是实验室里的结果。"
    contribution: "调研 LeRobot 架构和机器人 SDK，完成适配器与核心模块；打通自研 VR 遥操作系统和 LeRobot，设计数据采集与格式转换链路，并搭建训练、推理到机器人执行的流程。"
    outcome: "建立从数据到行为的全链路工作方式，覆盖通信瓶颈、控制联调和真机落地；项目中承担核心研发，公开代码与 Demo 仍在补强。"
    evidence: "项目经历来自实习与历史简历材料；具体本体范围、性能数字和独立贡献比例，待代码仓库或导师材料进一步证明。"
    status_class: "building"
    status_label: "材料补强中"
    tags: ["LeRobot", "Diffusion Policy", "VR teleoperation", "robot SDK", "control"]
  - number: "03"
    category: "product"
    category_label: "AI BUSINESS / PRODUCT"
    period: "2026.07 — NOW"
    title: "从客户问题开始，为轮式机器人寻找可复制的零售价值"
    one_liner: "把一线调研、任务链、Demo、需求沉淀和交付推进连成一条业务验证路径。"
    problem: "机器人进入零售场景，难点不是再做一个“会说话”的 Demo，而是找到客户愿意付费、现场能运行、团队能复制的单点价值。"
    contribution: "参与终端客户调研和现场观察，先定义要验证的场景与任务链，再推进快速 Demo；协同产品、售前和研发，把有效反馈整理成需求池、方案池、功能池和评审快照。"
    outcome: "正在把“真实问题 → 单点验证 → 客户 ROI → 产品包”的工作方法带进业务实践；当前重点是验证，而不是提前宣称结果。"
    evidence: "正式参加猎豹移动“傅盛 AI 战队”管培生培养计划已由确认书核实；客户数量、转化率和上线范围不在公开页虚构。"
    status_class: "current"
    status_label: "进行中"
    tags: ["customer discovery", "task chain", "Demo", "ROI", "requirements"]
  - number: "04"
    category: "research"
    category_label: "RESEARCH / EMBODIED AI"
    period: "2026"
    title: "追问：深层 Diffusion Policy 失败，到底失败在哪里"
    one_liner: "用跨层 Residual Attention 研究深层策略网络的表征访问问题。"
    problem: "标准 Diffusion Policy 加深后出现性能崩溃时，简单归因于“优化更难”并不能解释不同层间的差异；需要观察表征、梯度和任务成功率如何一起变化。"
    contribution: "围绕跨层残差注意力设计 full、block、late-only 等消融，比较网络深度、梯度、表征范数和任务成功率，形成“Representation Access Failure”的机制假设。"
    outcome: "研究计划继续用 Meta-World 与真机复杂任务验证；实验与论文状态尚未完成核验，因此这里展示问题与方法，不把阶段性数字写成已发表结果。"
    evidence: "研究记录和代码材料仍在整理；投稿、录用和所有实验数字均不作为公开成果表述。"
    status_class: "exploring"
    status_label: "研究中"
    tags: ["Diffusion Policy", "Residual Attention", "ablation", "representation", "Meta-World"]
principles:
  - number: "01"
    title: "先把问题变成任务链"
    detail: "不从“我们有什么技术”出发，而是先问：谁在什么处境下，要完成什么动作？只有任务链清楚，Demo 才有验证意义。"
  - number: "02"
    title: "先做能被观察的版本"
    detail: "把复杂系统切成最小闭环：先让信号可见、让动作可执行、让客户能反馈，再决定哪里值得继续投入。"
  - number: "03"
    title: "把反馈放回系统"
    detail: "失败不是结论，失败留下的证据才是。记录为什么做、验证了什么、哪些方案被证伪，下一次决策才会更快。"
  - number: "04"
    title: "结果和边界一起交付"
    detail: "我会同时说明完成了什么、个人负责哪一段、哪些指标有证据、哪些还需要补。这让协作更可靠，也让结果更容易复用。"
capabilities:
  - label: "01 / SIGNAL"
    title: "把现实接进系统"
    detail: "让硬件、传感器和人的操作成为模型可以消费的数据。"
    items: ["Tac3D / tactile sensing", "OpenCV / OpenMV", "UART / GPIO / STM32", "VR teleoperation"]
  - label: "02 / MODEL"
    title: "把数据变成行为"
    detail: "理解训练、推理、消融与控制之间的链路，而不是只停留在模型名词。"
    items: ["Diffusion Policy / ACT", "imitation learning", "data pipeline", "experiment design"]
  - label: "03 / SHIP"
    title: "把行为放进真实场景"
    detail: "从用户问题到 Demo，再到需求、研发和交付，持续缩短反馈回路。"
    items: ["customer discovery", "task-chain design", "AI Agent", "full-stack prototyping"]
