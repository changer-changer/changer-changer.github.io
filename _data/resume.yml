case_studies:
  - id: "tactile-vr"
    number: "01"
    category: "SYSTEM"
    category_label: "ROBOTICS / SYSTEM"
    period: "2025.11 — 2025.12"
    title: "触觉数据 VR 可视化系统"
    one_liner: "把触觉信号从传感器端带到研究者眼前。"
    short_bullets:
      - "集成 Tac3D SDK，开发 ROS2 节点与机器人端数据处理链路。"
      - "用 UDP 与 ROS2—VR 桥接，将统一格式的触觉点云实时渲染到 Meta Quest 3S。"
    problem: "触觉数据停留在采集端时，研究者很难直观看到接触表面和触觉分布；团队需要一条可以支撑后续实验的数据链路。"
    contribution: "调研并集成 Tac3D SDK，开发 ROS2 节点和机器人端数据处理逻辑；统一数据格式，用 UDP 与 ROS2—VR 桥接，把触觉点云实时渲染到 Meta Quest 3S。"
    outcome: "完成“传感器采集 → 机器人处理 → VR 可视化”的端到端闭环，并作为基础设施支持后续触觉实验。相关发明专利申请已获受理。"
    evidence: "专利申请受理通知书已核实；公开页不写未经日志证明的延迟数字。"
    status_class: "verified"
    status_label: "部分核实"
    tags: ["Tac3D", "ROS2", "Meta Quest 3S", "UDP", "3D point cloud"]
  - id: "tron2-loop"
    number: "02"
    category: "SYSTEM"
    category_label: "ROBOTICS / FULL LOOP"
    period: "2025.12 — 2026.03"
    title: "TRON2 触觉改造与 Diffusion Policy 全链路"
    one_liner: "让机器人适配、遥操作、数据和模型执行接成一条链。"
    short_bullets:
      - "完成机器人 SDK 适配与核心模块，打通自研 VR 遥操作系统和 LeRobot。"
      - "设计数据采集与格式转换链路，搭建训练、推理到机器人执行流程。"
    problem: "模型要真正落到机器人上，中间隔着 SDK、数据格式、遥操作、训练、推理和实时控制；任何一段断开，模型就只是实验室里的结果。"
    contribution: "调研 LeRobot 架构和机器人 SDK，完成适配器与核心模块；打通自研 VR 遥操作系统和 LeRobot，设计数据采集与格式转换链路，并搭建训练、推理到机器人执行的流程。"
    outcome: "建立从数据到行为的全链路工作方式，覆盖通信瓶颈、控制联调和真机落地；项目中承担核心研发。"
    evidence: "项目经历来自实习与历史简历材料；具体本体范围、性能数字和独立贡献比例待代码仓库或导师材料进一步证明。"
    status_class: "building"
    status_label: "材料补强中"
    tags: ["LeRobot", "Diffusion Policy", "VR teleoperation", "robot SDK", "control"]
  - id: "retail-validation"
    number: "03"
    category: "PRODUCT"
    category_label: "AI BUSINESS / PRODUCT"
    period: "2026.07 — 至今"
    title: "轮式机器人零售场景验证"
    one_liner: "从客户问题出发，验证机器人能否形成可复制的单点价值。"
    short_bullets:
      - "参与终端客户调研与现场观察，先定义要验证的场景和任务链。"
      - "推进快速 Demo，并把有效反馈整理成需求池、方案池、功能池和评审快照。"
    problem: "难点不是再做一个“会说话”的 Demo，而是找到客户愿意付费、现场能运行、团队能复制的单点价值。"
    contribution: "参与终端客户调研和现场观察，先定义要验证的场景与任务链，再推进快速 Demo；协同产品、售前和研发，把有效反馈整理成需求池、方案池、功能池和评审快照。"
    outcome: "正在把“真实问题 → 单点验证 → 客户 ROI → 产品包”的工作方法带进业务实践；当前重点是验证，而不是提前宣称结果。"
    evidence: "正式参加猎豹移动“傅盛 AI 战队”管培生培养计划已由确认书核实；客户数量、转化率和上线范围不在公开页虚构。"
    status_class: "current"
    status_label: "进行中"
    tags: ["customer discovery", "task chain", "Demo", "ROI", "requirements"]
  - id: "residual-attention"
    number: "04"
    category: "RESEARCH"
    category_label: "RESEARCH / EMBODIED AI"
    period: "2026"
    title: "深层 Diffusion Policy 的 Residual Attention 研究"
    one_liner: "从表征访问角度追问深层策略网络为什么失效。"
    short_bullets:
      - "设计 full、block、late-only 等跨层残差注意力消融。"
      - "比较网络深度、梯度、表征范数和任务成功率，形成机制假设。"
    problem: "标准 Diffusion Policy 加深后出现性能崩溃时，简单归因于“优化更难”不能解释不同层间的差异。"
    contribution: "围绕跨层残差注意力设计消融，比较网络深度、梯度、表征范数和任务成功率，形成“Representation Access Failure”的机制假设。"
    outcome: "研究计划继续用 Meta-World 与真机复杂任务验证；这里展示问题与方法，不把阶段性数字写成已发表结果。"
    evidence: "研究记录和代码材料仍在整理；投稿、录用和所有实验数字均不作为公开成果表述。"
    status_class: "exploring"
    status_label: "研究中"
    tags: ["Diffusion Policy", "Residual Attention", "ablation", "representation", "Meta-World"]
