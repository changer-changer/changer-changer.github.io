# Sparks — 金句：一句话，但足以改变下一次思考的方向
# 每条可选关联一篇文章（slug 为文章短名，点击可跳转）；它们是观察，不是结论
# 分节顺序与思考图谱的五问骨架一致：世界 → 人类 → 人生 → 方法 → 状态 → 组织 → 教育 → 他人的光

# ============ 一、世界如何运作 ============

- text: "不是事物拥有性质，而是所有性质聚合起来，成为了这个事物。"
- text: "一切描述只能被趋近：语言、物理规律、数学都是对世界的压缩，不是世界本身。"
- text: "软件可以复制，现实不能复制。"
- text: "金钱不是客观价值的度量，而是单笔交易中欲望的度量。"
- text: "市值是共识的幻觉，底座是极其稀缺的流动资金。"
- text: "趋向和场类似，覆盖整个宇宙——性质不是东西的，性质是世界的。"
  slug: "theory-tendency-theory-core"
- text: "时间也是性质：「之前」与「之后」是逻辑结构在时间维度上的表征。"
  slug: "theory-reality-as-latent-space"
- text: "没有正确的认知，只有能活下来的意识形态。"
  slug: "theory-society-as-collective-organism"

# ============ 二、人类是什么：认知与能力 ============

- text: "人类无法动态地认知世界，只能封装、压缩、局部建模。"
- text: "焦虑，就是妄图去做人类力所不能及的事。"
  slug: "anxiety-is-lust-for-the-impossible"
- text: "认知是过程，能力是结果。"
- text: "行动不是思考的结果，而是思考本身。"
- text: "错误不是失败，错误是训练数据；真正危险的是没有输出。"
- text: "成功者不知道自己为什么成功。"
- text: "能做到，不等于能解释自己为什么做到。"
- text: "能力的本质是身体的模式；每一个人的不同，都是能力的不同。"
  slug: "human-ability-is-patterns"
- text: "人类拥有世界模型的碎片，却不是世界本身的完整模型。"
  slug: "human-ability-is-patterns"
- text: "不存在「懂创业」，只存在「在具体情况下，我知道应该怎样做」。"
  slug: "human-ability-is-patterns"
- text: "只有身体，才是做到。"
- text: "做到什么，就有什么能力；这种能力是什么，本人也不理解，只有世界理解。"
- text: "你没法通过想一件别的事情，获得对这件事情的能力。"
- text: "学习的本质，是让神经系统在一类情境中产生越来越好的预测、判断和行动。"
- text: "方法论就是模仿加试错形成的黑盒：一个人一辈子，只需要弄清楚这一件事。"

# ============ 三、人类是什么：身体与驱动力 ============

- text: "目标不是发动机，驱动力才是。"
- text: "恐惧适合做保护机制，不适合做长期发动机。"
- text: "长期产出不等于工时：把一个变量拉满，打烂其余变量，总产出反而更低。"
  slug: "work-life-integration-not-balance"
- text: "身体不知道什么叫事业，它只知道负荷与恢复。"
  slug: "work-life-integration-not-balance"
- text: "满足身体非常容易：把自己哄开心，就没有那么困难。"
- text: "意愿由「相信这件事对我好」点燃，而不是「喜不喜欢」。"
- text: "杏仁核不怕难，怕失控：给它掌控感，它就给你空间。"
- text: "感受先于决定，身体先于逻辑，意义先于效率。"
- text: "焦虑说明你不知道自己在干什么；烦躁说明你的即时趋向不明确。"
- text: "恐惧大多只是没做过；适应了之后，你甚至会觉得现在的生活才令人恐惧。"
- text: "把极高强度的行为定义为「正常的」：越认为高不可攀，就越做不到。"
- text: "大脑不应该被用来持续审判自己。"
  slug: "bounded-mind-how-to-think-right"
- text: "不要把大脑当成全知的预言机、无限的优化器和持续审判自己的法官。"
  slug: "bounded-mind-how-to-think-right"
- text: "你反复运行什么循环，就会被训练成什么样的人。"
- text: "知道 ≠ 认为：认知只有整合进潜意识习惯，才真正起作用。"
- text: "对人类来说，脑子里不应该有「待办事项」这个概念。"
  slug: "subjectivity-and-behavior-patterns"
- text: "我只是我，我有我的身体，自身的后果只有我能承担。"
  slug: "subjectivity-and-behavior-patterns"
- text: "一个人的不同 = 基准现实 + 思考模式：无数模块，完全随机获得，没有一个人被任何人塑造。"
- text: "恐惧被铸造成服从。"
  slug: "suppressed-thinking"
- text: "恐惧让你感受不到自己的方向，焦虑让你看不到未来的方向。"
  slug: "suppressed-thinking"
- text: "传统家庭的问题不是认知低下，而是营造了一个错误的反馈环境，训练了一个错误的模型。"
  slug: "retrain-your-own-model"

# ============ 四、信息与判断 ============

- text: "基于已有信息做不出最好的判断，而获得新信息需要成本——这是必须接受的世界基本事实。"
- text: "复杂世界不存在提前算出来的全局最优解，只有当前信息下的概率判断。"
- text: "可控范围 = 行动能改变其概率分布的事件集合；焦虑的物理来源，是把注意力给了不可改变概率分布的事。"
- text: "计划也是一种选择：不做选择，就是选择了随机。"
- text: "决策投入由代价和可回撤程度决定：容易回撤的少想快试，难以回撤的多想再动。"
- text: "在风险可控的情况下，用最小代价购买信息。"
- text: "Buy in 不是盲目信任，是有范围、有条件、可更新的判断委托。"
- text: "理解能理解的，相信可靠的，验证未知的。"
- text: "让世界成为判断系统：错了不代表你错误，代表模型需要更新。"
  slug: "from-closed-to-open-cognition"
- text: "不要用想法验证想法，让现实验证想法。"
- text: "判断一条认知的价值，只需要问一句：相信它之后，我会做出什么不同的动作？"

# ============ 五、人生与目的 ============

- text: "人生只在做两件事：找到好的目标，弄清什么才能达到目标。"
- text: "目的，是人类限制下的趋向。"
- text: "欲望不是隐藏的宝藏，而是对外部可能性的响应。"
- text: "有用的和喜好是同一个标准：相信一件事能达到你想要的结果却不去做，就是在欺骗身体。"
- text: "自由 = 做出决定的过程；不自由是没做任何决定，被文化控制了身体。"
- text: "你做的所有决定，只能由你自己做；不存在「跟着别人走」这个选项。"
- text: "乐观主义、理想和期望，是对目标的最高精度定义。"
- text: "You need to see heaven to be in heaven."
  slug: "world-model-operation-model"
- text: "想成为的人是一套系统，不是一个技能；系统无法被纸面计划，只能置身其中被同化。"
- text: "所有的痛苦和煎熬都是一个信号：存在需要解决的问题。"
- text: "社会成功只有两件事：赢得竞争门票，然后把看到的东西组合起来做事。"
- text: "成功的本质，是在社会占据了一个正确的位置。"

# ============ 六、方法 ============

- text: "单点击穿：断其一指，远好于伤其九指。"
- text: "同时认为五件事都是第一优先级，等于没有优先级。"
- text: "至简胜于至繁：复杂常常只是没有识别出核心矛盾。"
- text: "努力是系统优化智穷力竭后的补偿。"
- text: "智力是有限资产：不重复造轮子，善用别人的智慧成果。"
- text: "第一性原理定方向，工程思维找路径。"
- text: "未知的未知，先弄明白再去做；已知的未知，先去做再优化。"
  slug: "know-what-you-dont-know"
- text: "好奇心是防止认知过拟合的正则化。"
- text: "真正的护城河不是你知道多少，而是你能多快把未知变成已知。"
- text: "高维不等于抽象层级：同时用高和低两个抽象层级思考一件事，本身就是高维。"
- text: "独立思考的基础，是理解世界如何变化，而不是坚持己见。"
- text: "从动态眼光看世界：低垂的果实，往往意味着糟糕的复利未来。"
- text: "探索域永远零押注：你只是侦察兵——观察、记录、判断，不占领、不投入、不承诺。"
- text: "现象从来不是单因果：构造三个互相竞争的解释，再问什么信号出现时该切换判断。"
- text: "做大事和做小事是一样困难的。"
  slug: "theory-social-matrix-leverage"
- text: "优化的三个层级：效率、结构、定性；而优先级恰恰相反。"
  slug: "theory-optimization-theory-three-levels"
- text: "世界 > 认知边界 > 可能行为 > 实际事实。"
  slug: "theory-worldline-and-straight-line"
- text: "聪明和努力是拴狗链。"
  slug: "intelligence-and-hardwork-are-leashes"
- text: "学生总认为存在某个神奇的炼丹，让他们具有各种能力。实际上，先在对应的岗位上，你才能获得对应的能力，成为对应的人。"
  slug: "opportunity-has-three-layers"

# ============ 七、状态与行动 ============

- text: "放松不是没有目标，而是不再用紧张代替目标。"
- text: "承认感受，但不要自动相信感受背后的解释。"
- text: "很多所谓的迷茫，本质上是被恐惧禁止的行动。"
- text: "理解别人，但不要失去自己。"
- text: "别人的奇怪看法，是他的问题，不是你的负担。"
- text: "只有先让自己成为稳定、清醒、有行动能力的主体，才可能持续地影响更大的世界。"
- text: "占用工作记忆的不是任务本身，是「记住任务」这件事。"
- text: "好的模式是：放松的时候把事情想明白，做的时候不分心。"
- text: "一个人只能同时做好一件事。"
- text: "一个人应该从世界获得反馈，而不是自我反馈。"
- text: "对于大的、抽象的事，目的性就是思维清晰的来源。"
- text: "起点可以粗糙，但反馈必须真实；工具可以简单，但执行必须认真。"
- text: "如果每一个想法都能立即修改计划，那实际上就没有计划。"
  slug: "from-diet-to-methodology"
- text: "困难往往只是当前能力与条件的边界。"
  slug: "theory-is-not-driver"
- text: "不完美不是问题；不能学习、不能纠错、不能承担结果，才是问题。"
  slug: "shantai-banzhi-and-hidden-inferiority"
- text: "不需要先成为英雄，才有资格开始做事。"
  slug: "shantai-banzhi-and-hidden-inferiority"
- text: "世界不是由完美的人推动的：把并不体面的过程，做成了伟大的结果。"
  slug: "shantai-banzhi-and-hidden-inferiority"

# ============ 八、组织与人际 ============

- text: "客观正确的方案，不等于能被执行的方案。"
  slug: "how-things-get-done-in-organizations"
- text: "负责不是态度，是生产能力：降低组织运行的不确定性。"
  slug: "how-things-get-done-in-organizations"
- text: "不要裸上报：带着事实、已尝试的方案、代价和推荐去，而不是带着焦虑去。"
- text: "把不同人的局部目标，接到同一条行动链上。"
  slug: "how-things-get-done-in-organizations"
- text: "把朋友搞得多多的，把敌人搞得少少的。"
- text: "不和人对抗，但坚定地处理问题：把讨论从「谁对谁错」变成「下一步怎样最低成本地减少不确定性」。"
- text: "正式会议应该用来确认共识，而不是第一次公开解决全部冲突。"
- text: "伟大的组织不是没有混乱，而是能在混乱中不断恢复秩序。"
- text: "表达能力不是软能力，是有及格线的硬能力——它是思维清晰度的外化。"
- text: "集体沉默不是理解：目标是否清楚，看它能否生成一致的行动和交付物。"
- text: "故事塑造驱动与权力：人们认为系统无限复杂，所以听从信息发布者。"
- text: "沟通本身就是产品。"
  slug: "communication-is-product"
- text: "产品不是功能的集合，产品是被感知的价值。"
  slug: "product-is-perceived-value"

# ============ 九、教育与价值交换 ============

- text: "赚钱是与社会的价值交换；教育是个人资产——这是两套完全不同的度量。"
  slug: "education-is-not-value-exchange"
- text: "学习一辈子不代表有价值，那只是一种爱好。"
  slug: "education-is-not-value-exchange"
- text: "大学从来不是为了有用而诞生的。"
  slug: "education-is-not-value-exchange"
- text: "教育的真正价值，是让人看见自己继承的观念，从不再认同的叙事中获得自由。"
  slug: "education-is-not-value-exchange"
- text: "财富是一种认证，一种贡献排行榜。"
  slug: "education-is-not-value-exchange"
- text: "让别人学习才能赚钱——那需要组织社会资源的能力，一套完全不同的评价标准。"
  slug: "education-is-not-value-exchange"

# ============ 十、他人的光 ============

- text: "不要把笃定误认为智慧，也不要把世俗意义上的成功误认为有意义的人生。——一位教授的送别信"
- text: "不要把人生太多时间，花在努力成为一个「你以为这个世界期待你成为的人」。——一位教授的送别信"
- text: "保护好你的好奇心，也保护好你仍然愿意在乎、愿意关心这个世界的能力。——一位教授的送别信"
- text: "摒弃宏大叙事和美丽语言的陷阱：结论锚定具体数据和具体行为。"
- text: "一个活灵活现的真实案例，穿透力远胜书面逻辑和抽象概念。"
- text: "客户视角是需终身打磨的核心能力，优先级远高于技术实现。"
- text: "看人的优点是有效的，看人缺点没什么用。"
- text: "能让你成功的道理你早就知道——你需要去做对应的事，才能体会对应的道理。"
- text: "每个人能做的事都差不多：你只是能想得更深，做得更好，更洞悉本质。"
