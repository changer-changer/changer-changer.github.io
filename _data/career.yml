  tactile-visualization:
    title: 触觉数据 VR 可视化系统
    category: 具身智能 · 发明专利
    period: 2025.11 — 2025.12
    role: 瞬恒智能 · 独立实现系统 · 共同发明人
    summary: 打通 Tac3D → ROS2 → Meta Quest 3S，将接触面的触觉数据实时重建成可观察的 3D 点云。
    result: 发明专利申请已公开 · CN122547231A
    cover: tactile-vr-cloud
    flow: [采集接触面触觉数据, 经 ROS2 处理并通过 UDP 转发, 在 Quest 3S 渲染点云]
    links:
      - label: 国家知识产权局公布文献
        url: http://epub.cnipa.gov.cn/patent/CN122547231A
      - label: 中文专利全文
        url: https://patents.google.com/patent/CN122547231A/zh
    sections:
      - title: 想解决什么问题
        text: 机械臂接触物体时，研究者需要看清接触位置和接触面的变化。我把传感器输出接到 VR，让这些变化能在三维空间里直接观察。
      - title: 我做了哪些工作
        text: 我集成了 Tac3D SDK，开发 ROS2 节点和数据处理流程，再通过 UDP 把点云传给 Meta Quest 3S。在方老师提供的实验环境里，我独立完成了采集、传输与显示的联调。
      - title: 交付与专利
        text: 系统用于后续的触觉实验。北京邮电大学申请的《一种基于高密度柔性触觉传感器的接触表面虚拟现实可视化方法及系统》于 2026 年 8 月 11 日公布，申请公布号为 CN122547231A。我是共同发明人。
    gallery:
      - image: tactile-vr-cloud
        caption: VR 中重建的触觉接触面
