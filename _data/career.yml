cases:
  inside-computing:
    title: 计算之境
    category: 交互式教学 · CS:APP
    period: 2026 年秋
    role: 独立制作
    summary: 把缓存、流水线和虚拟内存做成能预测、能操作、能核对的模型。
    result: 被北邮计算机基础课采用 · 抖音约 25 万播放
    cover: computing-3d-overview
    cover_position: center 61%
    flow: [预测下一步, 操作模型, 核对系统状态]
    links:
      - label: 在线体验
        url: https://changer-changer.github.io/inside-computing/
      - label: 项目代码
        url: https://github.com/changer-changer/inside-computing
      - label: 原点社区知识分享
        url: https://weixin.qq.com/sph/ADGghVDOAB
    sections:
      - title: 我想让学生看见什么
        text: 读书时，缓存、流水线和虚拟内存最难理解的地方，是学生只能看到定义和最后的计算结果。比如一次访存到底查了哪里、什么时候命中、下一步为什么变了，这些中间状态很难从静态插图里自己推出来。
      - title: 3D 用来表达什么
        text: 我先问每个概念的关键关系是什么。缓存是地址如何映射到组，流水线是同一时钟下多条指令的位置和依赖，虚拟内存则是地址如何一层层翻译。能靠空间和位置讲清的关系，就做成场景；需要精确核对的地方，用数值、状态表和即时检查。
      - title: 怎么验证学生能用
        text: 课程让学生先预测，再操作，最后比较自己的答案和模型状态。平台目前有 12 章教学内容和 10 个实验入口，并提供即时检查和学习记录。北邮计算机基础课老师已把它用作课堂材料；按我的发布记录，抖音播放约 25 万，点赞约八九千。
