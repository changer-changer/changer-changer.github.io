  agent-research:
    title: 多智能体协作与任务恢复
    category: 多智能体科研
    period: 2026 年秋起 · 进行中
    role: 与一位博士生合作，校友团队提供算力
    summary: 我和一位博士生研究协作中的返工。一个 Agent 的交付失效后，怎么判断哪些任务要重做、哪些成果还能用？
    result: 已完成公开排程题的首轮对照，并在日程改期和代码变更题上试跑。
    sections:
      - title: 为什么开始做这项研究
        text: 做触觉机器人时，我学会了把系统跑通。到了科研，我还要学会从异常里提出一个问题，再设计实验解释它。面壁智能黑客松上，几位导师建议我选一个自己长期关心、实际系统也会遇到的问题，并通过小实验练习观察、提出假设和做对照。
      - title: 我们先怎么验证
        text: 我们用八道公开排程题模拟机器临时停机，让不同工作流从同一份已交付的计划出发，并用相同的模型、工具、预算和验收标准比较。我们记录最后能否恢复可行排程、哪些文件被重做，以及协调消耗了多少。
      - title: 第一轮结果怎样改变问题
        text: 多道题沿原分工就能修好。不过在一次失败里，两组各自消除了本组的停机违规，合并后却让同一台机器在同一时段被安排了两次。我们因此把问题收窄到如何追踪变化影响了哪些交付，再决定哪里要重做。最近已在日程改期和代码需求变更的开发题上试跑，留出题尚未评测。
      - title: 此前的工程积累
        text: 此前我在杨成老师团队的 MASFactory 框架上实现过 ShinkaEvolve 程序进化工作流。这段实践让我熟悉了如何把多智能体流程接入真实执行环境。

