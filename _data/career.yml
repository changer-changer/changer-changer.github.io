  automotive-video-studio:
    title: 车企 AI 视频生成系统 · Video Studio
    category: 傅盛 AI 战队 · 企业交付
    period: 2026 年
    role: 工作流设计、原型开发与客户对接
    summary: 用字级台词时间轴对齐镜头和声音，把一次定制视频交付做成可复用的前端工具。
    result: 交付车企样片 · 周末完成 Video Studio 原型 · 移交研发推进落地
    links:
      - label: 返回傅盛 AI 战队经历
        url: /resume/cases/fusheng-ai-team/
      - label: 返回猎豹移动经历
        url: /resume/cases/field-fde/
    flow: [拆解台词与镜头要求, 确定 TTS 配音并切出时间轴, 按时间轴生成画面和声音, 把流程封装进 Video Studio]
    sections:
      - title: 先定清楚视频怎么验收
        text: 客户要求台词逐字对齐时间轴，对每段对应的画面也有明确要求。我先把要求拆开，为建模、画面生成、配乐、音效和剪辑分别明确交付内容，再让它们对齐同一条时间轴。
      - title: 让声音决定镜头和音效的时间点
        text: 我们先定文本，再用 TTS 试音并选定配音。Agent 按配音节点切出时间线，我用每段时间线组织画面提示词、安排配乐和音效，再生成镜头并完成剪辑。这套流程解决了客户团队当时难以完成的样片需求。
      - title: 将样片的工作流做成工具
        text: 客户认可样片，希望用同样的流程继续做视频。我用一个周末做出 Video Studio 原型，通过前端页面发起生成，由 Agent 按步骤执行，支持调用客户自己的接口。随后我继续和业务人员对接，将原型与工作流交给研发团队推进落地。

