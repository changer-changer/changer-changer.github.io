  tactile-vla:
    title: 触觉感知与机器人精密装配
    featured_title: 具身智能触觉工程 · 科研实习
    featured_video: true
    category: 具身智能 · 真机研发
    period: 2025.09 — 2026.03
    role: 瞬恒智能（方斌老师的实验室） · 科研实习
    summary: 在自习室搭起 SO-101、跑通 π₀，后来进组做触觉编码、策略训练和真机装配。
    result: 完成公差要求小于 0.1 毫米的装配任务 · 发明专利申请已公开
    cover: tactile-assembly
    flow: [读取接触面触觉数据, 单独编码并给策略提供条件, 在真机上执行装配]
    video:
      src: /assets/video/resume/tactile-assembly.mp4
      poster: tactile-demo
      caption: 真机装配记录 · 视频展示末端执行动作，公差数值为项目要求。
    sections:
      - title: 从自习室里的第一台机械臂开始
        text: 我想做具身智能，那时还没有实验室资源，就自己买了台机械臂，在学校自习室从零搭起 SO-101 系统，跑通了 π₀ 策略。之后我带着这个原型去找方斌老师交流，加入瞬恒智能，开始做触觉感知和机器人精密装配。
      - title: 什么信息是装配真正需要的
        text: 视觉能帮助机械臂接近目标，插入时还需要知道触点有没有偏、接触面怎样变化。我把任务拆成能读出的触觉信号、可以学习的示教和能回到真机验证的动作。
      - title: 怎样把触觉接到模仿学习
        text: 我为触觉模态单独做了编码器，将触觉表示作为条件送进 Diffusion Policy 的 U-Net，并在项目里接触了 ACT。我也做过 ROS2 数据链路、VR 遥操作、运动控制、嵌入式和 3D 打印。遇到装配问题时，先单查采集、坐标和执行，再回头看策略。
      - title: 我交付了什么
        text: 我和一位研究生合作，为精密装配客户完成公差要求小于 0.1 毫米的装配任务。我还独立实现了 Tac3D 到 Quest 3S 的触觉点云可视化，方老师提供实验环境。相关发明专利申请已公开（CN122547231A），我是共同发明人。
