  field-fde:
    title: 企业 AI 需求验证与交付
    category: 傅盛 AI 战队 · 猎豹移动
    period: 2026 年 7 月中旬—8 月初
    role: 管培生 · 企业 AI 需求验证与交付
    summary: 短期参与 FDE，和企业一起拆解工作流程，做现场演示验证需求，也为一家车企交付了 AI 视频样片和可复用的工具原型。
    result: 两场完成现场诊断与演示 · 一家药企进入后续落地
    cover: fde-diagnostic
    links:
      - label: 返回傅盛 AI 战队经历
        url: /resume/cases/fusheng-ai-team/
      - label: 车企 AI 视频生成系统 · Video Studio
        url: /resume/cases/automotive-video-studio/
    flow: [读取各店消费者反馈, 汇总高频问题, 对照备货与商品页决策]
    sections:
      - title: 「店铺难管理」具体是什么意思
        text: 一家药企有自己的工厂和多家线上店。工厂排期仍依赖白板，强行接 AI 要先补数据基础。销售端已有数据，我追问老板最想做哪类决定，发现各平台的用户反馈分散，他们难以判断该如何备货、优化商品页和调整渠道。
      - title: 先找一条数据能走通的路
        text: 我把需求缩到可演示的一条链路：通过平台官方接口汇总反馈，提炼常见问题，再把建议对应回具体的店铺和产品。现场用 Demo 说明 AI 能帮到哪一步，后续接入与交付由团队承接。
      - title: 为什么有些场景停在演示
        text: 另一次讨论里，金融企业想汇总分散在多套内部系统里的信息，后续选择自行推进。两次经历让我更重视现场验证的三个条件：数据能否接到、用结果的人是谁、演示之后谁继续负责。
      - title: 车企交付 · AI 视频生成系统
        text: 我们先为客户定制生成流程并交付样片。客户希望复用这套流程，我用一个周末做出 Video Studio 原型，继续对接业务人员，再交给研发团队推进落地。
