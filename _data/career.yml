  wheelchair:
    title: 轮椅门店的机器人销售助手
    category: 傅盛 AI 战队 · 猎户星空
    period: 2026 年 8 月初—9 月中旬
    role: 猎户星空 · 具身智能机器人场景探索、产品研发与售前实践
    summary: 用连续对话调出 Android 页面、产品资料和演示视频。
    result: 完成初版并在两家门店试部署
    cover: wheelchair-demo
    cover_position: center 32%
    links:
      - label: 返回傅盛 AI 战队经历
        url: /resume/cases/fusheng-ai-team/
    flow: [听懂顾客问题, 检索产品资料, 调出页面或视频, 结合当前画面回答追问]
    video:
      src: /assets/video/resume/wheelchair.mp4
      poster: wheelchair-demo
      orientation: portrait
      caption: 豹小秘门店机器人 · 双屏界面与对话演示
    sections:
      - title: 我先去验证为什么商场方案难做
        text: 我联系附近几家商场，并去双桥万达实地询问。现场讨论把问题落到了白天的移动责任、夜间可靠回充、布线位置和日常运维。商品与地图不断更新，现场维护随设备规模增长。于是我把注意力转向范围和责任更明确的单店。
      - title: 轮椅门店需要怎样的销售辅助
        text: 在智能轮椅门店，我看到加盟店难以长期培训熟悉所有型号的销售，而消费者需要亲眼看避障等能力才敢买。机器人既能转向迎宾，也能边回答「能上飞机吗」「能载多重」边播放已有演示素材；呼叫轮椅也可以做成短视频里的引流演示。
      - title: 让对话负责调度页面
        text: 我把 Android 里的产品资料和视频页面封装成可调用的工具。Agent 先根据上下文理解问题，再检索本地资料、调用对应页面，并把当前展示内容留在对话上下文里。用户追问时，它可以接着解释刚放出来的东西。
      - title: 验证到了哪一步
        text: 我先参加售前沟通和客户调研，随后做产品设计、开发联调和现场演示。初版在两家门店试部署。返校后这段工作告一段落，销售增量仍缺少可归因的数据。

  retail-tryon:
    title: 零售一键换衣机器人
    featured_title: 猎豹移动黑客松全国总冠军
    featured_result: 零售一键换衣机器人 · 约 13 小时完成演示
    category: 零售机器人 · 快速产品开发
    period: 2026 年 5 月底
    role: 猎豹移动 AI 少年派黑客松
    summary: 把店员上传、商品浏览和 AI 换装接成同一条流程。
    result: 全国总冠军 · 约 13 小时完成演示 · 试穿功能接入 AgentOS
    cover: hackathon-pitch
    cover_caption: 黑客松现场，讲解豹小秘的服装零售方案。
    flow: [店员给新品拍照上传, 顾客在屏幕上浏览和选款, 拍照生成试穿图]
    sections:
      - title: 从一次真实的买衣服体验出发
        text: 在运动品牌店里，我遇到一摞又一摞只露出一小部分的衣服。款式接近、SKU 又多，想看全得一件件拉出来，选完还要一件件试。问题可以拆成两步，先是看不全，再是试得慢。
      - title: 为什么选轮式机器人
        text: 固定屏幕可以浏览商品，轮式机器人还可以转向顾客、用语音接住问题，再让顾客在大屏直接操作。我把这些能力和 AI 换装接起来，让顾客能在同一个入口完成浏览和试穿。
      - title: 怎样跑通店员和顾客两端
        text: 店员用上传链接给新品拍照，屏幕同步展示商品；顾客选款、拍照并一键生成试穿图。团队借用机器人已有接口接了导航和导览，约 13 小时完成可演示的端到端流程。获奖后，试穿功能进入 AgentOS，随后随零售方案面向部分门店交付。
